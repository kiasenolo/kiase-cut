[project]
name = "tesetoa"
version = "0.1.0"
description = "A small Jianying-style video editor on top of the MLT engine"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "numpy>=1.26", "Pillow>=10.1", "moderngl>=5.8"]

[project.scripts]
tesetoa = "tesetoa.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tesetoa = ["filters/*"]
